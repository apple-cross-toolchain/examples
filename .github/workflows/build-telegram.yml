name: build-telegram

on:
  pull_request:
  push:
    branches:
      - main

env:
  TELEGRAM_BRANCH: rules_applecross
  XCODE_DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  package_sdks:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Find the rules_applecross commit Telegram pins
        id: applecross
        run: |
          commit=$(
            curl -fsSL "https://raw.githubusercontent.com/apple-cross-toolchain/Telegram-iOS/$TELEGRAM_BRANCH/MODULE.bazel" |
              sed -n '/module_name = "rules_applecross"/,/)/s/.*commit = "\([0-9a-f]*\)".*/\1/p'
          )
          test -n "$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: apple-cross-toolchain/rules_applecross
          ref: ${{ steps.applecross.outputs.commit }}
      - name: Read Xcode identity
        id: xcode
        env:
          DEVELOPER_DIR: ${{ env.XCODE_DEVELOPER_DIR }}
        run: |
          identity=$(xcodebuild -version)
          echo "identity=${identity//$'\n'/-}" >> "$GITHUB_OUTPUT"
      - name: Cache packaged Apple SDKs
        id: apple-sdks-cache
        uses: actions/cache@v6
        with:
          path: apple-sdks.tar.zst
          key: apple-sdks-${{ steps.xcode.outputs.identity }}-${{ hashFiles('tools/package-sdks.sh') }}
      - name: Package Apple SDKs
        if: steps.apple-sdks-cache.outputs.cache-hit != 'true'
        env:
          DEVELOPER_DIR: ${{ env.XCODE_DEVELOPER_DIR }}
        run: tools/package-sdks.sh
      - uses: actions/upload-artifact@v7
        with:
          name: apple-sdks
          path: apple-sdks.tar.zst
          compression-level: 0
          retention-days: 1

  build_telegram:
    needs: package_sdks
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Clone Telegram-iOS
        run: |
          git clone --depth 1 --recursive --shallow-submodules \
            -b "$TELEGRAM_BRANCH" \
            https://github.com/apple-cross-toolchain/Telegram-iOS.git
      - uses: actions/download-artifact@v8
        with:
          name: apple-sdks
          path: apple-sdks-artifact
          skip-decompress: true
      - name: Extract Apple SDKs
        run: unzip -q apple-sdks-artifact/* -d Telegram-iOS && rm -rf apple-sdks-artifact
      - name: Build Telegram with remote execution
        working-directory: Telegram-iOS
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: >-
          bazel
          --host_jvm_args=-Xmx10g
          build
          --config=remote
          --remote_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY"
          --ios_multi_cpus=sim_arm64
          --//Telegram:disableProvisioningProfiles
          --@build_bazel_rules_swift//swift:copt=-whole-module-optimization
          //Telegram:Telegram
      - uses: actions/upload-artifact@v7
        with:
          name: Telegram.ipa
          path: Telegram-iOS/bazel-bin/Telegram/Telegram.ipa
